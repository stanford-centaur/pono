name: CI
on:
  push:
  workflow_dispatch: # allow manual trigger
    inputs:
      svcomp_package:
        description: Build only the package for SV-COMP
        type: boolean
        default: false
# Superseded runs are pointless on branches, but main needs a run per commit:
# giving each of its commits its own group keeps them from queueing, where a
# pending run is cancelled as soon as the next one arrives. A run that builds
# the package for SV-COMP neither cancels the other runs nor is cancelled by
# them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}${{ inputs.svcomp_package && '-svcomp-package' || '' }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !inputs.svcomp_package }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [release, debug]
        include:
          - build_type: debug
            conf_build_opts: --debug
    name: ${{ matrix.os }}:${{ matrix.build_type }}
    runs-on: ${{ matrix.os}}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so that `git describe` can name the release the
          # build descends from. fetch-tags alone would fetch the tags but
          # not the commits in between, leaving the distance uncomputable.
          fetch-depth: 0
      - name: Install Packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libbison-dev \
            libfl-dev \
            libmpfr-dev \
            cmake \
            ninja-build
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.build_type }}
          max-size: 1G
          create-symlink: true
      - name: Install bison (macOS)
        if: runner.os == 'macOS'
        run: contrib/setup-bison.sh
      - name: Python Environment Setup
        run: |
          python3 -m venv ./.venv
          source .venv/bin/activate
          python3 -m pip install \
            Cython \
            meson \
            packaging \
            setuptools
      - name: Download MathSAT
        run: ./ci-scripts/setup-msat.sh --auto-yes
      - name: Setup Btor2Tools
        run: ./contrib/setup-btor2tools.sh
      - name: Setup Smt-Switch
        env:
          CPATH: /opt/homebrew/include # let libpoly (from cvc5) find gmp headers
          DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib # this lets the precompiled MathSAT binary (used in the tests) find libgmp
        run: |
          source .venv/bin/activate
          ./contrib/setup-smt-switch.sh --python --with-btor --with-msat --with-z3
      - name: Configure
        run: |
          source .venv/bin/activate
          ./configure.sh --python --with-btor --with-msat --with-z3 --static ${{ matrix.conf_build_opts }}
      - name: Build
        run: |
          cd build
          make -j"$(getconf _NPROCESSORS_ONLN)"
      - name: Upload built executable
        uses: actions/upload-artifact@v7
        with:
          name: pono-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}
          path: ./build/pono
      - name: Test C++
        id: test-cpp
        continue-on-error: true
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd build
          jobs=$(getconf _NPROCESSORS_ONLN)
          # -j parallelizes linking the test binaries, the env var running them
          CTEST_PARALLEL_LEVEL="$jobs" make -j"$jobs" check
      - name: Upload failing test log
        if: steps.test-cpp.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}
          path: build/tests/Testing/Temporary/LastTest.log
      - name: Fail pipeline due to C++ test failure
        if: steps.test-cpp.outcome == 'failure'
        run: |
          echo "C++ tests failed. Inspect the artifact for details."
          exit 1
      - name: Install Python Bindings
        run: |
          source .venv/bin/activate
          python3 -m pip install ./build/python[test]
      - name: Test Python Bindings
        run: |
          source .venv/bin/activate
          pytest ./tests
  # Builds the archive to submit to SV-COMP: the portfolio script and its
  # portfolio, the binary, and the licenses of everything linked into it. A
  # manual run with svcomp_package runs this job only.
  svcomp-package:
    if: ${{ inputs.svcomp_package }}
    name: SV-COMP package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so that `git describe` can name the package.
          fetch-depth: 0
      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libbison-dev \
            libfl-dev \
            libmpfr-dev \
            cmake \
            ninja-build \
            python3-yaml \
            unzip \
            zip
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: svcomp-package
          max-size: 1G
          create-symlink: true
      - name: Python Environment Setup
        run: |
          python3 -m venv ./.venv
          source .venv/bin/activate
          python3 -m pip install \
            meson \
            packaging \
            setuptools
      - name: Download MathSAT
        run: ./ci-scripts/setup-msat.sh --auto-yes
      - name: Setup Btor2Tools
        run: ./contrib/setup-btor2tools.sh
      - name: Setup Smt-Switch
        run: |
          source .venv/bin/activate
          ./contrib/setup-smt-switch.sh --with-msat --with-z3
      - name: Configure
        run: ./configure.sh --with-msat --with-z3 --static
      - name: Build
        run: make -C build -j"$(getconf _NPROCESSORS_ONLN)" pono-bin
      # The script tests the package with the system's Python, which has
      # PyYAML, rather than with the one of the environment above.
      - name: Package
        run: scripts/package-binary.sh --output-dir package build
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          path: package/pono-*.zip
          # as the zip archive itself, not inside another one
          archive: false
          if-no-files-found: error
      # The archive is unpacked outside of the checkout, as a user has it. The
      # test follows the upload, so that an archive that fails it is at hand.
      - name: Test the package
        run: |
          unzip -q package/pono-*.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP"/pono-*/smoketest.sh
